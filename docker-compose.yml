services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/src/CotelNet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CotelNet: "Server=sqlserver,1433;Database=CotelNetNext;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CotelNet.Api}"
      Jwt__Audience: "${JWT_AUDIENCE:-CotelNet.Frontend}"
      Bootstrap__AdminUser: "${BOOTSTRAP_ADMIN_USER:-}"
      Bootstrap__AdminPassword: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports:
      - "8088:80"
    networks: [internal, coolify]
    restart: unless-stopped

volumes:
  sqlserver-data:

networks:
  internal:
    driver: bridge
  coolify:
    external: true

